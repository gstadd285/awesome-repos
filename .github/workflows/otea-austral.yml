name: Otea Austral · CI

on:
  push:
    branches: [main]
    paths:
      - "otea-austral/**"
      - ".github/workflows/otea-austral.yml"
  pull_request:
    paths:
      - "otea-austral/**"
      - ".github/workflows/otea-austral.yml"

permissions:
  contents: read

concurrency:
  group: otea-austral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: otea-austral
    # Postgres desechable para las pruebas de base de datos (migraciones,
    # permisos mínimos, disparadores y repositorios).
    services:
      postgres:
        image: postgres:17.8@sha256:69dddb030ab69d669d8d7c6abf67aeb448178e5270d5f123a21f4f7ac8b46a24
        env:
          # Base efímera de la CI, sin datos: no es un secreto.
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PRUEBAS_DATABASE_URL: postgres://postgres:postgres-ci@localhost:5432/postgres
      # Si falta la base, las pruebas fallan en vez de omitirse.
      PRUEBAS_DB_OBLIGATORIAS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historial completo: el escáner de secretos revisa todos los commits, no solo el último.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: otea-austral/.nvmrc
          cache: npm
          cache-dependency-path: otea-austral/package-lock.json

      - name: Instalar dependencias (versiones fijas del lockfile)
        run: npm ci

      # Plan de seguridad, control 2: ningún secreto en los archivos ni en el historial de git.
      - name: Buscar secretos en los archivos y en todo el historial
        run: npm run seguridad:secretos

      # NIST CSF ID.RA-09: autenticidad e integridad del software antes de usarlo.
      - name: Verificar firmas del registro npm
        run: npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas (incluye Postgres con el usuario de mínimos privilegios)
        run: npm test

      - name: Migraciones idempotentes y usuario de la aplicación
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres-ci@localhost:5432/postgres
          CLAVE_ROL_APP: ci-otea-web-solo-pruebas
        run: |
          npm run db:migrar
          npm run db:migrar
          npm run db:rol-app -- otea_web

      # Plan de seguridad, control 1: se construye con secretos falsos y se comprueba que ninguno queda
      # en el resultado (que es lo que llega al navegador y a la imagen), ni mapas de código públicos.
      - name: Build con secretos falsos y comprobación de que no quedan en el resultado
        run: npm run seguridad:canarios

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      # Las de desarrollo tienen hallazgos sin corrección publicada (ver SECURITY.md):
      # se muestran, pero no bloquean.
      - name: Auditoría completa (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true

      # NIST CSF ID.AM-02: inventario del software que se despliega.
      - name: Inventario de software (SBOM CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Publicar el SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-otea-austral
          path: otea-austral/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  # Pruebas de navegador (Playwright) sobre el build de producción.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: otea-austral
    services:
      postgres:
        image: postgres:17.8@sha256:69dddb030ab69d669d8d7c6abf67aeb448178e5270d5f123a21f4f7ac8b46a24
        env:
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # La aplicación entra con el usuario de mínimos privilegios, como en producción.
      DATABASE_URL: postgres://otea_web:ci-otea-web-solo-pruebas@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: otea-austral/.nvmrc
          cache: npm
          cache-dependency-path: otea-austral/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Base de datos de prueba (migraciones y usuario de la aplicación)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres-ci@localhost:5432/postgres
          CLAVE_ROL_APP: ci-otea-web-solo-pruebas
        run: |
          npm run db:migrar
          npm run db:rol-app -- otea_web

      - name: Build
        run: npm run build

      - name: Pruebas de navegador
        run: npm run test:e2e

      - name: Publicar el informe si fallan
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-playwright
          path: otea-austral/playwright-report
          retention-days: 14

  # Imagen de contenedor para Cloud Run: se construye y se prueba como correría en producción.
  contenedor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: otea-austral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir la imagen
        run: docker build --tag otea-austral:ci .

      - name: Corre sin privilegios y sin secretos, código fuente ni mapas de código
        run: |
          test "$(docker run --rm --entrypoint id otea-austral:ci -u)" = "10001"
          docker run --rm --entrypoint sh otea-austral:ci -c '
            test ! -e /app/src && test ! -e /app/.env && test ! -e /app/node_modules/sharp
            sobrantes="$(find /app \( -name "*.map" -o -name ".env*" \) | head -3)"
            test -z "$sobrantes" || { echo "Sobran archivos: $sobrantes"; exit 1; }'

      - name: Arranca con configuración válida y responde con las cabeceras de seguridad
        run: |
          docker run -d --name otea-ok -p 8080:8080 \
            -e NEXT_PUBLIC_SITE_URL=https://oteaustral.example.org otea-austral:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/salud >/dev/null && break
            sleep 1
          done
          test "$(curl -s http://localhost:8080/api/salud)" = '{"estado":"ok"}'
          # Cloud Run termina TLS y envía `X-Forwarded-Proto: https`: así llegan las solicitudes reales.
          cabeceras="$(curl -sI -H 'X-Forwarded-Proto: https' http://localhost:8080/)"
          echo "$cabeceras"
          echo "$cabeceras" | grep -i '^content-security-policy:.*nonce-'
          echo "$cabeceras" | grep -i '^strict-transport-security:'
          echo "$cabeceras" | grep -i -q '^x-powered-by:' && exit 1
          # La URL del sitio se lee al ejecutar, no al construir la imagen.
          curl -s http://localhost:8080/sitemap.xml | grep -q 'https://oteaustral.example.org/'
          # Sin optimizador de imágenes ni panel sin configurar.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/_next/image?url=%2Ficon.svg&w=64&q=75')" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://localhost:8080/admin)" = "404"
          # HTTPS forzado (plan de seguridad, control 19): lo que llega por http se redirige al dominio configurado.
          redireccion="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' 'http://localhost:8080/alertas?x=1')"
          test "$redireccion" = "308 https://oteaustral.example.org/alertas?x=1"
          # Una ruta con doble barra no puede sacar al visitante del sitio.
          destino="$(curl -s --path-as-is -o /dev/null -w '%{redirect_url}' 'http://localhost:8080//otro.example/x')"
          case "$destino" in https://oteaustral.example.org/*|http://localhost:8080/*) ;; *) echo "Redirección a $destino"; exit 1 ;; esac
          # La sonda de Cloud Run no se redirige, venga como venga.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: http' http://localhost:8080/api/salud)" = "200"

      - name: Una configuración insegura hace fallar la sonda (Cloud Run no le da tráfico)
        run: |
          docker run -d --name otea-mala -p 8081:8080 -e WAITLIST_MODE=memoria otea-austral:ci
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8081/ && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/salud)" != "200"

      - name: Registros del contenedor si algo falla
        if: failure()
        run: |
          docker logs otea-ok || true
          docker logs otea-mala || true
